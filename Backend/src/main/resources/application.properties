spring.application.name=SmartToolRoomAndProductionManagementSystem

# =====================================================

# DATABASE CONFIGURATION

# =====================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/springbootproject}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================

# FILE UPLOAD CONFIGURATION

# =====================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================

# RAZORPAY CONFIGURATION

# =====================================================

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# =====================================================

# CORS CONFIGURATION

# =====================================================

app.cors.allowed-origins=[http://localhost:8081,http://127.0.0.1:8081,https://yantrax.in,https://www.yantrax.in](http://localhost:8081,http://127.0.0.1:8081,https://yantrax.in,https://www.yantrax.in)

# =====================================================

# SESSION COOKIE CONFIGURATION

# =====================================================

server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
